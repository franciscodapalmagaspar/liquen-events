name: Publicar na Vercel (só à mão)

# Nasceu a 28/10 (#298), com a conta no plano grátis (Hobby): a Vercel
# bloqueava as publicações automáticas de commits cujo autor não era o dono da
# conta («blocked»), e um Deploy Hook não passava por essa verificação.
#
# Com a conta no Pro, a ligação normal do GitHub voltou a publicar cada push a
# `main`. Com o hook a disparar também no push, CADA commit passou a ser
# construído DUAS vezes em produção (vê-se desde 1/11; a 3/11 foram 26
# construções para 14 commits) — o dobro dos minutos de construção e do
# armazenamento, que são o grosso da conta.
#
# Fica só o botão manual (Actions → «Publicar na Vercel» → Run workflow), para
# o dia em que a ligação normal falhe. O link do hook vive no segredo
# VERCEL_DEPLOY_HOOK; sem ele, o job não faz nada e não falha.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publicar-vercel
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Chamar o Deploy Hook
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "Sem o segredo VERCEL_DEPLOY_HOOK: nada a publicar."
            exit 0
          fi
          curl --fail --silent --show-error -X POST "$HOOK" > /dev/null
          echo "Publicação pedida à Vercel."
